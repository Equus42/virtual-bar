<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Bar</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #2c2f33;
            color: white;
        }

        header {
            background-color: #23272a;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 2em;
            color: #7289da;
        }

        #bar-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: calc(100vh - 80px);
            background-image: url('https://images.pexels.com/photos/1058277/pexels-photo-1058277.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=750&w=1260');
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .welcome-text {
            font-size: 1.5em;
            margin-bottom: 20px;
            text-align: center;
        }

        .button-container {
            display: flex;
            gap: 20px;
        }

        .button {
            background-color: #7289da;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            color: white;
            transition: background-color 0.3s;
        }

        .button:hover {
            background-color: #5b6ead;
        }

        .form-container {
            margin-top: 30px;
            text-align: center;
        }

        .form-container form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: #2c2f33;
            padding: 20px;
            border: 1px solid #7289da;
            border-radius: 10px;
        }

        .form-container form input {
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: #23272a;
            color: white;
            outline: none;
        }

        .form-container form button {
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: #7289da;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .form-container form button:hover {
            background-color: #5b6ead;
        }

        .chat-container {
            margin-top: 30px;
            width: 300px;
            height: 400px;
            background-color: #23272a;
            border: 1px solid #7289da;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background-color: #7289da;
            color: white;
            padding: 10px;
            text-align: center;
            font-weight: bold;
        }

        .chat-messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
        }

        .chat-messages p {
            margin: 5px 0;
        }

        .chat-input {
            display: flex;
            border-top: 1px solid #7289da;
        }

        .chat-input input {
            flex: 1;
            padding: 10px;
            border: none;
            outline: none;
            background-color: #2c2f33;
            color: white;
        }

        .chat-input button {
            padding: 10px 20px;
            border: none;
            background-color: #7289da;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .chat-input button:hover {
            background-color: #5b6ead;
        }

        .avatars {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #7289da;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            font-weight: bold;
            color: white;
            cursor: pointer;
            position: relative;
        }

        .avatar:hover::after {
            content: 'Click to Edit';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #5b6ead;
            padding: 5px;
            border-radius: 3px;
            font-size: 0.8em;
        }

        footer {
            background-color: #23272a;
            text-align: center;
            padding: 10px;
            position: absolute;
            bottom: 0;
            width: 100%;
        }

        footer p {
            margin: 0;
            font-size: 0.9em;
            color: #999;
        }

        .avatar-editor {
            display: none;
            flex-direction: column;
            gap: 10px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #2c2f33;
            padding: 20px;
            border: 1px solid #7289da;
            border-radius: 10px;
            z-index: 10;
        }

        .avatar-editor input {
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: #23272a;
            color: white;
            outline: none;
        }

        .avatar-editor button {
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: #7289da;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .avatar-editor button:hover {
            background-color: #5b6ead;
        }
    </style>
    <script>
        const messages = [];

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const message = input.value;
            if (message.trim() !== '') {
                messages.push(`You: ${message}`);
                updateChat();
                input.value = '';

                // Simulate a bot response
                setTimeout(() => {
                    messages.push('Bot: Thanks for your message!');
                    updateChat();
                }, 1000);
            }
        }

        function updateChat() {
            const chatMessages = document.getElementById('chat-messages');
            chatMessages.innerHTML = '';
            messages.forEach(msg => {
                const p = document.createElement('p');
                p.textContent = msg;
                chatMessages.appendChild(p);
            });
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function openAvatarEditor(avatarId) {
            const editor = document.getElementById('avatar-editor');
            editor.style.display = 'flex';
            editor.setAttribute('data-avatar-id', avatarId);
        }

        function saveAvatar() {
            const editor = document.getElementById('avatar-editor');
            const avatarId = editor.getAttribute('data-avatar-id');
            const newAvatarText = document.getElementById('avatar-text').value;
            const avatar = document.getElementById(avatarId);
            avatar.textContent = newAvatarText;
            editor.style.display = 'none';
        }

        function closeAvatarEditor() {
            const editor = document.getElementById('avatar-editor');
            editor.style.display = 'none';
        }
    </script>
</head>
<body>
    <header>
        <h1>Welcome to the Virtual Bar</h1>
    </header>
    <main>
        <div id="bar-container">
            <div class="overlay">
                <div class="welcome-text">
                    Grab a drink, meet new people, and enjoy the vibe!
                </div>
                <div class="avatars">
                    <div class="avatar" id="avatar1" onclick="openAvatarEditor('avatar1')">A</div>
                    <div class="avatar" id="avatar2" onclick="openAvatarEditor('avatar2')">B</div>
                    <div class="avatar" id="avatar3" onclick="openAvatarEditor('avatar3')">C</div>
                </div>
                <div id="avatar-editor" class="avatar-editor">
                    <input id="avatar-text" type="text" placeholder="Enter new avatar text">
                    <button onclick="saveAvatar()">Save</button>
                    <button onclick="closeAvatarEditor()">Cancel</button>
                </div>
                <div class="form-container">
                    <h2>Log In</h2>
                    <form>
                        <input type="text" placeholder="Username" required>
                        <input type="password" placeholder="Password" required>
                        <button type="submit" onclick="alert('Logging in...')">Log In</button>
                    </form>
                    <h2>Sign Up</h2>
                    <form>
                        <input type="text" placeholder="Username" required>
                        <input type="email" placeholder="Email" required>
                        <input type="password" placeholder="Password" required>
                        <button type="submit" onclick="alert('Signing up...')">Sign Up</button>
                    </form>
                </div>
                <div class="chat-container">
                    <div class="chat-header">Chat Room</div>
                    <div class="chat-messages" id="chat-messages"></div>
                    <div class="chat-input">
                        <input id="chat-input" type="text" placeholder="Type a message...">
                        <button onclick="sendMessage()">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2025 Virtual Bar Inc. All rights reserved.</p>
    </footer>
</body>
</html>
